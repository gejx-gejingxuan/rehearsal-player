<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
:root{
  --panel:#f3f6fa; --strip:#e7ebf1; --control:#ffffff; --control-hover:#e2ebf6;
  --accent:#3e8edc; --text:#2a303a; --text-dim:#767e8c; --border:#c2c8d4;
  --card-border:#c6ccd8; --card-hover:#eef4fc; --active-bg:#2f343c;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  display:flex; flex-direction:column; height:100%;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--panel); color:var(--text); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
/* ---------- 顶栏 ---------- */
header{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:var(--control); border-bottom:1px solid var(--border); flex:none;
}
header .title{font-size:16px; font-weight:700; white-space:nowrap}
header .sub{font-size:12px; color:var(--text-dim); white-space:nowrap}
header .spacer{flex:1}
.btn{
  border:1px solid var(--border); background:var(--control); color:var(--text);
  padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; white-space:nowrap;
  font-family:inherit; transition:background .12s;
}
.btn:hover{background:var(--control-hover)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#337cc2}
.btn.on{background:#dcebfa; border-color:var(--accent); color:#1f5f9e; font-weight:600}
/* ---------- 视频区 ---------- */
#stage{position:relative; flex:1; min-height:0; background:#000}
#video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; cursor:pointer}
#image{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:none}
#empty{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; background:#000; color:#e8ebf0; text-align:center; padding:20px;
}
#empty .big{font-size:22px; font-weight:700}
#empty .btns{display:flex; gap:10px}
#centerPlay{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:84px; height:84px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(20,24,30,.55); color:#fff; font-size:34px; line-height:1;
  display:none; align-items:center; justify-content:center; padding-left:8px;
  backdrop-filter:blur(2px);
}
#centerPlay:hover{background:rgba(62,142,220,.85)}
#centerPlay.show{display:flex}
body.full-f{cursor:none}
body.full-f #centerPlay,body.full-f #stage{cursor:none}
/* ---------- 底栏 ---------- */
#dock{flex:none; background:var(--strip); border-top:1px solid var(--border); display:flex; flex-direction:column}
#ctlbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:8px 12px; background:var(--control); border-bottom:1px solid var(--border);
}
#ctlbar .sep{width:1px; height:22px; background:var(--border); margin:0 2px}
.ctl{
  border:1px solid var(--border); background:var(--control); color:var(--text);
  padding:5px 10px; border-radius:7px; cursor:pointer; font-size:13px; font-family:inherit; white-space:nowrap;
}
.ctl:hover{background:var(--control-hover)}
.ctl.on{background:#dcebfa; border-color:var(--accent); color:#1f5f9e; font-weight:600}
#progressWrap{flex:1; min-width:160px; position:relative; height:26px; display:flex; align-items:center}
#progress{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px;
  background:#d7dce5; outline:none; cursor:pointer}
#progress::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--border); cursor:pointer}
.abdot{position:absolute; top:2px; width:4px; height:22px; border-radius:2px; pointer-events:none; transform:translateX(-2px)}
#dotA{background:#3e8edc}
#dotB{background:#e67e22}
#timeLabel{font-size:12.5px; color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums}
#nameLabel{font-size:13px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#posLabel{font-size:12.5px; color:var(--text-dim); white-space:nowrap}
#volWrap{display:flex; align-items:center; gap:6px}
#volume{width:80px; accent-color:var(--accent)}
select.ctl{padding:5px 6px}
/* ---------- 卡片条 ---------- */
#strip{
  display:flex; gap:10px; padding:10px 12px; overflow-x:auto; overflow-y:hidden;
  min-height:150px; background:var(--strip);
}
#editBar{
  display:none; align-items:center; gap:8px; padding:8px 12px;
  border-top:1px solid var(--border); background:var(--control);
}
#editBar.show{display:flex}
#editName{
  flex:0 0 220px; padding:5px 10px; border:1px solid var(--border);
  border-radius:7px; font-size:13px; font-family:inherit; color:var(--text);
}
.eb{font-size:12px; color:var(--text-dim)}
.ebv{font-size:12px; color:var(--text-dim); min-width:34px; font-variant-numeric:tabular-nums}
#editVol{width:90px; accent-color:var(--accent)}
.card{
  flex:0 0 200px; display:flex; flex-direction:column; align-items:flex-start; gap:8px;
  padding:14px 16px; border-radius:12px; cursor:pointer; text-align:left;
  background:var(--control); border:1.5px solid var(--card-border);
  font-family:inherit; transition:background .12s, transform .12s;
}
.card:hover{background:var(--card-hover); transform:translateY(-1px)}
.card.active{background:var(--active-bg); border-color:var(--c,#3e8edc)}
.badge{
  width:32px; height:32px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:15px; background:var(--c,#3e8edc);
}
.card .name{font-size:14px; color:#404650; width:100%; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; font-weight:600}
.card .dur{font-size:12.5px; color:#7c8492; font-variant-numeric:tabular-nums}
.card.active .name{color:#fff}
.card.active .dur{color:#b8c0cc}
/* ---------- 提示与帮助 ---------- */
#toast{
  position:fixed; left:50%; bottom:140px; transform:translateX(-50%) translateY(20px);
  background:rgba(42,48,58,.92); color:#fff; padding:9px 16px; border-radius:8px;
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  max-width:80vw;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#help{
  position:fixed; inset:0; background:rgba(15,18,22,.55); display:none;
  align-items:center; justify-content:center; z-index:70;
}
#help.show{display:flex}
#helpBox{
  background:var(--control); border:1px solid var(--border); border-radius:12px;
  padding:22px 26px; max-width:480px; width:92vw; max-height:80vh; overflow:auto;
}
#helpBox h2{font-size:17px; margin-bottom:12px}
#helpBox table{width:100%; border-collapse:collapse; font-size:13px}
#helpBox td{padding:5px 6px; border-bottom:1px solid var(--strip); vertical-align:top}
#helpBox td:first-child{white-space:nowrap; padding-right:14px}
kbd{
  background:var(--strip); border:1px solid var(--border); border-bottom-width:2px;
  border-radius:5px; padding:1px 7px; font-family:inherit; font-size:12px; white-space:nowrap;
}
#helpBox .close{float:right; border:0; background:none; font-size:20px; cursor:pointer; color:var(--text-dim)}
</style>
</head>
<body>

<header>
<div class="title">🎬 Rehearsal Player</div>
<div class="spacer"></div>
  <button class="btn primary" id="btnFiles">添加视频 / 图片</button>
  <button class="btn" id="btnFolder">添加文件夹</button>
  <button class="btn" id="btnClear">清空</button>
  <button class="btn" id="btnSave" title="打包所有片段与设置，下载 zip">保存 ZIP</button>
  <button class="btn" id="btnImport" title="从 zip 恢复片段与设置（替换当前列表）">导入 ZIP</button>
  <input type="file" id="zipInput" accept=".zip,application/zip" hidden>
  <button class="btn" id="btnLoop">循环</button>
  <button class="btn" id="btnChain">连播</button>
  <button class="btn" id="btnHelp">❓ 快捷键</button>
  <input type="file" id="fileInput" multiple accept="video/*,image/*,.mp4,.m4v,.mov,.webm,.mkv,.avi,.ogv,.flv,.ts,.wmv,.jpg,.jpeg,.png,.gif,.webp,.bmp" hidden>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
</header>

<div id="stage">
  <video id="video" preload="auto" playsinline></video>
  <img id="image" alt="">
  <div id="empty">
    <div class="big">把视频 / 图片拖进来，开始排练</div>
    <div class="btns">
      <button class="btn primary" id="btnFiles2">添加视频 / 图片</button>
      <button class="btn" id="btnFolder2">添加文件夹</button>
    </div>
  </div>
  <button id="centerPlay" title="播放 / 暂停">▶</button>
</div>

<div id="dock">
  <div id="ctlbar">
    <button class="ctl" id="btnPlay" title="空格">▶</button>
    <div id="progressWrap">
      <div class="abdot" id="dotA" style="display:none"></div>
      <div class="abdot" id="dotB" style="display:none"></div>
      <input type="range" id="progress" min="0" max="1000" value="0" step="0.1">
    </div>
    <span id="timeLabel">00:00 / 00:00</span>
    <span class="sep"></span>
    <button class="ctl" id="btnPrev" title="上一个 (Alt+左键)">◀</button>
    <button class="ctl" id="btnNext" title="下一个 (Alt+右键)">▶</button>
    <span id="posLabel">0/0</span>
    <span id="nameLabel"></span>
    <span class="sep"></span>
    <button class="ctl" id="btnMute" title="静音 (M)">🔊</button>
    <div id="volWrap"><input type="range" id="volume" min="0" max="100" value="80" title="音量 ↑/↓ 或滚轮"></div>
    <select class="ctl" id="speed" title="播放速度">
      <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
      <option value="1" selected>1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
    </select>
    <span class="sep"></span>
    <button class="ctl" id="btnAB" title="区间循环开关">AB 循环</button>
    <button class="ctl" id="btnSetA" title="循环起点 = 当前时间 (A)">起点 A</button>
    <button class="ctl" id="btnSetB" title="循环终点 = 当前时间 (B)">终点 B</button>
    <button class="ctl" id="btnClearAB" title="清除起点终点 (X)">清除</button>
    <span class="eb" id="abLabel"></span>
    <span class="sep"></span>
    <button class="ctl" id="btnFull" title="全屏 (F / 双击画面)">⛶ 全屏</button>
  </div>
  <div id="strip"></div>
  <div id="editBar">
    <input type="text" id="editName" placeholder="片段名称" maxlength="60">
    <label class="eb">音量</label>
    <input type="range" id="editVol" min="0" max="100">
    <span class="ebv" id="editVolVal"></span>
    <label class="eb">速度</label>
    <select class="ctl" id="editSpeed">
      <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
      <option value="1">1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
    </select>
    <span class="sep"></span>
    <button class="ctl" id="btnUp" title="上移">↑</button>
    <button class="ctl" id="btnDown" title="下移">↓</button>
    <button class="ctl" id="btnDel" title="删除">删除</button>
  </div>
</div>

<div id="toast"></div>

<div id="help">
  <div id="helpBox">
    <button class="close" id="btnHelpClose">✕</button>
    <h2>快捷键</h2>
    <table>
      <tr><td><kbd>1</kbd>～<kbd>9</kbd> / <kbd>0</kbd></td><td>切换片段</td></tr>
      <tr><td><kbd>空格</kbd></td><td>播放 / 暂停</td></tr>
      <tr><td><kbd>F</kbd> / 双击画面</td><td>全屏</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>退出全屏</td></tr>
      <tr><td><kbd>Alt</kbd>+<kbd>左键</kbd> / <kbd>右键</kbd></td><td>上一个 / 下一个</td></tr>
      <tr><td><kbd>←</kbd> / <kbd>→</kbd></td><td>快退 / 快进 5 秒</td></tr>
      <tr><td><kbd>↑</kbd> / <kbd>↓</kbd> / 滚轮</td><td>音量</td></tr>
      <tr><td><kbd>M</kbd></td><td>静音</td></tr>
      <tr><td><kbd>A</kbd> / <kbd>B</kbd> / <kbd>X</kbd></td><td>AB：起点 / 终点 / 清除</td></tr>
      <tr><td><kbd>L</kbd> / <kbd>N</kbd></td><td>循环 / 连播</td></tr>
    </table>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const video = $('#video'), stage = $('#stage'), strip = $('#strip');
const image = $('#image');
const editBar = $('#editBar'), editName = $('#editName'), editVol = $('#editVol'), editVolVal = $('#editVolVal'), editSpeed = $('#editSpeed');
const progress = $('#progress'), timeLabel = $('#timeLabel');
const nameLabel = $('#nameLabel'), posLabel = $('#posLabel');
const volume = $('#volume'), speedSel = $('#speed');
const centerPlay = $('#centerPlay'), toastEl = $('#toast');
const dotA = $('#dotA'), dotB = $('#dotB');
const btnPlay = $('#btnPlay'), btnLoop = $('#btnLoop'), btnChain = $('#btnChain'), btnAB = $('#btnAB');
const abLabel = $('#abLabel');

const palette = ['#3e8edc','#e67e22','#2ecc71','#9b59b6','#e74c3c','#1abc9c','#f1c40f','#3498db','#e65178','#607d8b'];
const videoExt = /\.(mp4|m4v|mov|webm|mkv|avi|ogv|flv|ts|wmv|3gp)$/i;
const imageExt = /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i;
const mediaExt = /\.(mp4|m4v|mov|webm|mkv|avi|ogv|flv|ts|wmv|3gp|jpg|jpeg|png|gif|webp|bmp|svg)$/i;

let clips = [];            // {name, url, duration}
let cur = -1;
let seeking = false;
let chain = false, loop = false, abOn = false, A = null, B = null;
let toastTimer = null;
let imgTimer = null;

/* ---------- 工具 ---------- */
function fmt(t){
  if(!isFinite(t) || t < 0) return '--:--';
  t = Math.floor(t);
  const m = Math.floor(t/60), s = t % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2600);
}
function savePrefs(){
  try{ localStorage.setItem('rp_prefs', JSON.stringify({
    speed: speedSel.value, chain, loop, abOn, vol: volume.value
  })); }catch(e){}
}
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('rp_prefs') || '{}');
    if(p.speed) speedSel.value = p.speed;
    chain = !!p.chain; loop = !!p.loop; abOn = !!p.abOn;
    volume.value = (p.vol == null) ? 80 : p.vol;
  }catch(e){}
}
loadPrefs();
video.volume = volume.value / 100;
video.playbackRate = parseFloat(speedSel.value);

/* ---------- 文件导入 ---------- */
function addFiles(files){
  const list = [...files].filter(f => f && mediaExt.test(f.name))
    .sort((a,b)=>a.name.localeCompare(b.name,'zh',{numeric:true}));
  if(!list.length){ toast('未找到可播放的媒体文件'); return; }
  for(const f of list){
    const url = URL.createObjectURL(f);
    const type = videoExt.test(f.name) ? 'video' : 'image';
    clips.push({ name:f.name, url, duration:NaN, type, label:null, vol:video.volume, speed:parseFloat(speedSel.value), file:f });
  }
  renderStrip();
  measureDurations(clips.length - list.length, list.length);
  $('#empty').style.display = 'none';
  if(cur < 0) loadClip(0, true);
}
function measureDurations(start, count){
  for(let i = start; i < start + count; i++){
    if(!clips[i] || clips[i].type !== 'video') continue;
    (function(idx){
      const el = document.createElement('video');
      el.preload = 'metadata'; el.muted = true;
      el.onloadedmetadata = function(){
        clips[idx].duration = el.duration;
        renderStrip();
        el.removeAttribute('src'); el.load();
      };
      el.onerror = function(){ el.removeAttribute('src'); };
      el.src = clips[idx].url;
    })(i);
  }
}

/* ---------- 卡片底栏 ---------- */
function renderStrip(){
  strip.innerHTML = '';
  clips.forEach((c,i)=>{
    const d = document.createElement('button');
    const col = palette[i % palette.length];
    const key = i < 9 ? String(i+1) : (i === 9 ? '0' : '');
    d.className = 'card' + (i === cur ? ' active' : '');
    d.style.setProperty('--c', col);
    d.title = (c.label || c.name) + (key ? '（快捷键 ' + key + '）' : '');
    const b = document.createElement('span'); b.className='badge'; b.textContent = String(i+1);
    const n = document.createElement('span'); n.className='name'; n.textContent = c.label || c.name;
    const t = document.createElement('span'); t.className='dur';
    t.textContent = c.type === 'image' ? '图片' : (isFinite(c.duration) ? fmt(c.duration) : '--:--');
    d.appendChild(b); d.appendChild(n); d.appendChild(t);
    d.onclick = ()=>loadClip(i, true);
    strip.appendChild(d);
  });
}

/* ---------- 播放控制 ---------- */
function loadClip(i, autoplay){
  if(i < 0 || i >= clips.length) return;
  cur = i;
  const c = clips[i];
  clearTimeout(imgTimer);
  if(c.type === 'image'){
    video.pause();
    video.removeAttribute('src');
    image.src = c.url;
    image.style.display = 'block';
    video.style.display = 'none';
    progress.disabled = true;
    timeLabel.textContent = '图片';
    if(autoplay) armImageTimer();
  } else {
    image.style.display = 'none';
    video.style.display = 'block';
    progress.disabled = false;
    if(video.getAttribute('src') !== c.url){ video.src = c.url; }
    video.volume = (c.vol != null) ? c.vol : (volume.value / 100);
    video.playbackRate = c.speed || parseFloat(speedSel.value);
    volume.value = Math.round(video.volume * 100);
    speedSel.value = String(video.playbackRate);
    syncVol();
    if(autoplay) video.play().catch(()=>{});
  }
  renderStrip();
  const cards = strip.children;
  if(cards[i]) cards[i].scrollIntoView({block:'nearest', inline:'nearest'});
  updateInfo();
  syncPlayIcon();
  syncEditBar();
}
function syncEditBar(){
  const c = clips[cur];
  if(cur >= 0 && c){
    editBar.classList.add('show');
    editName.value = c.label || c.name;
    editVol.value = Math.round((c.vol != null ? c.vol : volume.value/100) * 100);
    editVolVal.textContent = editVol.value + '%';
    editSpeed.value = String(c.speed || speedSel.value);
  } else {
    editBar.classList.remove('show');
  }
}
function moveClip(delta){
  if(cur < 0) return;
  const ni = cur + delta;
  if(ni < 0 || ni >= clips.length) return;
  const tmp = clips[cur]; clips[cur] = clips[ni]; clips[ni] = tmp;
  cur = ni;
  renderStrip(); updateInfo(); syncEditBar();
  const cards = strip.children;
  if(cards[cur]) cards[cur].scrollIntoView({block:'nearest', inline:'nearest'});
}
function removeClip(){
  if(cur < 0) return;
  const c = clips[cur];
  try{ URL.revokeObjectURL(c.url); }catch(e){}
  clearTimeout(imgTimer);
  clips.splice(cur, 1);
  if(clips.length === 0){
    cur = -1;
    video.pause(); video.removeAttribute('src'); video.style.display = 'block';
    image.style.display = 'none'; image.removeAttribute('src');
    progress.disabled = false;
    $('#empty').style.display = 'flex';
  } else {
    loadClip(Math.min(cur, clips.length - 1), true);
  }
  renderStrip(); updateInfo(); syncEditBar();
}
function armImageTimer(){
  clearTimeout(imgTimer);
  if(cur >= 0 && clips[cur] && clips[cur].type === 'image' && chain){
    imgTimer = setTimeout(()=>{ if(cur >= 0 && clips[cur] && clips[cur].type === 'image' && chain){ loadClip((cur + 1) % clips.length, true); } }, 5000);
  }
}
function goTo(i){
  loadClip(i, true);
}
function prev(){
  if(!clips.length) return;
  clearTimeout(imgTimer);
  loadClip((cur - 1 + clips.length) % clips.length, true);
}
function next(){
  if(!clips.length) return;
  clearTimeout(imgTimer);
  loadClip((cur + 1) % clips.length, true);
}
function togglePlay(){
  if(!clips.length) return;
  const c = clips[cur];
  if(c && c.type === 'image'){ next(); return; }
  if(video.paused) video.play().catch(()=>{});
  else video.pause();
}
function seekBy(s){
  if(!clips.length) return;
  const t = Math.min(Math.max(0, video.currentTime + s), video.duration || 0);
  video.currentTime = t;
}
function adjVol(d){
  const v = Math.min(1, Math.max(0, video.volume + d));
  video.volume = v; video.muted = false;
  if(clips[cur]) clips[cur].vol = video.volume;
  volume.value = Math.round(v*100); syncVol(); savePrefs();
}
function syncVol(){
  btnMute.textContent = video.muted ? '🔇' : '🔊';
}
function syncPlayIcon(){
  const isImg = clips[cur] && clips[cur].type === 'image';
  btnPlay.textContent = isImg ? '▶' : (video.paused ? '▶' : '⏸');
  centerPlay.classList.toggle('show', clips.length > 0 && (isImg || video.paused));
  centerPlay.textContent = btnPlay.textContent;
}
function updateTime(){
  const t = video.currentTime || 0, d = video.duration || 0;
  timeLabel.textContent = fmt(t) + ' / ' + fmt(d);
  if(!seeking && d > 0) progress.value = t / d * 1000;
}
function updateInfo(){
  posLabel.textContent = (clips.length ? cur + 1 : 0) + '/' + clips.length;
  nameLabel.textContent = clips[cur] ? (clips[cur].label || clips[cur].name) : '';
}
function updateAB(){
  const d = video.duration || 0;
  if(A != null && d > 0){
    dotA.style.display = 'block';
    dotA.style.left = (A / d * 100) + '%';
  } else dotA.style.display = 'none';
  if(B != null && d > 0){
    dotB.style.display = 'block';
    dotB.style.left = (B / d * 100) + '%';
  } else dotB.style.display = 'none';
  if(A != null && B != null){ abLabel.textContent = fmt(A) + ' → ' + fmt(B); }
  else if(A != null){ abLabel.textContent = '起点 ' + fmt(A); }
  else if(B != null){ abLabel.textContent = '终点 ' + fmt(B); }
  else { abLabel.textContent = ''; }
}
function setA(){
  if(!clips.length) return;
    A = video.currentTime;
    if(B != null && A >= B) B = null;
    updateAB();
}
function setB(){
  if(!clips.length) return;
    B = video.currentTime;
    if(A != null && B <= A) A = null;
    updateAB();
}
  function clearAB(){ A = B = null; updateAB(); }
function syncToggles(){
  btnLoop.classList.toggle('on', loop);
  btnChain.classList.toggle('on', chain);
  btnAB.classList.toggle('on', abOn);
  armImageTimer();
  savePrefs();
}

/* ---------- 事件 ---------- */
video.addEventListener('play', syncPlayIcon);
video.addEventListener('pause', syncPlayIcon);
video.addEventListener('loadedmetadata', ()=>{ updateTime(); updateAB(); });
video.addEventListener('durationchange', ()=>{
  if(cur >= 0 && isFinite(video.duration)){
    clips[cur].duration = video.duration;
    renderStrip();
  }
});
video.addEventListener('timeupdate', ()=>{
  updateTime(); updateAB();
  if(abOn && A != null && B != null && B > A && video.currentTime >= B - 0.05){
    video.currentTime = A;
  }
});
video.addEventListener('ended', ()=>{
  if(cur >= 0 && clips[cur] && clips[cur].type === 'image') return;
  if(abOn && A != null && B != null && B > A){ video.currentTime = A; video.play().catch(()=>{}); return; }
  if(loop){ video.currentTime = 0; video.play().catch(()=>{}); return; }
  if(chain && clips.length > 1){ loadClip((cur + 1) % clips.length, true); return; }
  syncPlayIcon();
});
video.addEventListener('error', ()=>{
  if(cur >= 0 && clips[cur]) toast('无法播放：' + clips[cur].name + '（浏览器不支持该编码）');
});

progress.addEventListener('input', ()=>{
  seeking = true;
  if(video.duration) video.currentTime = progress.value / 1000 * video.duration;
  updateTime();
});
progress.addEventListener('change', ()=>{ seeking = false; });
progress.addEventListener('pointerdown', ()=>{ seeking = true; });

volume.addEventListener('input', ()=>{
  video.volume = volume.value / 100; video.muted = false; syncVol(); savePrefs();
  if(clips[cur]) clips[cur].vol = video.volume;
});
speedSel.addEventListener('change', ()=>{ video.playbackRate = parseFloat(speedSel.value); if(clips[cur]) clips[cur].speed = video.playbackRate; savePrefs(); });

stage.addEventListener('click', e=>{
  if(e.target === stage || e.target === video || e.target === image) togglePlay();
});
stage.addEventListener('dblclick', e=>{
  if(e.target === stage || e.target === video || e.target === image){ e.preventDefault(); toggleFull(); }
});
stage.addEventListener('wheel', e=>{
  if(clips.length){ e.preventDefault(); adjVol(e.deltaY < 0 ? 0.05 : -0.05); }
}, {passive:false});

/* ---------- 全屏 ---------- */
function isFs(el){ return document.fullscreenElement === el; }
function toggleFull(){
  if(isFs(stage)) document.exitFullscreen().catch(()=>{});
  else stage.requestFullscreen().catch(()=>toast('浏览器不允许全屏'));
}
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('full-f', isFs(stage));
  if(!isFs(stage)) document.body.classList.remove('full-f');
  armCursorHide();
});
let cursorTimer = null;
function armCursorHide(){
  clearTimeout(cursorTimer);
  const active = document.fullscreenElement;
  if(active){
    document.body.classList.remove('hide-cursor');
    cursorTimer = setTimeout(()=>{ if(document.fullscreenElement) document.body.classList.add('hide-cursor'); }, 2600);
  } else {
    document.body.classList.remove('hide-cursor');
  }
}
document.addEventListener('mousemove', armCursorHide);

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e=>{
  const tag = e.target && e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if($('#help').classList.contains('show')){
    if(e.key === 'Escape') $('#help').classList.remove('show');
    return;
  }
  const k = e.key;
  if(/^[1-9]$/.test(k)){ goTo(parseInt(k,10)-1); e.preventDefault(); return; }
  if(k === '0'){ goTo(9); e.preventDefault(); return; }
  switch(k){
    case ' ': togglePlay(); e.preventDefault(); break;
    case 'f': case 'F': toggleFull(); break;
    case 'm': case 'M': video.muted = !video.muted; syncVol(); break;
    case 'ArrowUp': adjVol(0.05); e.preventDefault(); break;
    case 'ArrowDown': adjVol(-0.05); e.preventDefault(); break;
    case 'ArrowLeft': seekBy(-5); e.preventDefault(); break;
    case 'ArrowRight': seekBy(5); e.preventDefault(); break;
    case 'a': case 'A': setA(); break;
    case 'b': case 'B': setB(); break;
    case 'x': case 'X': clearAB(); break;
    case 'l': case 'L': loop = !loop; syncToggles(); break;
    case 'n': case 'N': chain = !chain; syncToggles(); break;
  }
});

/* ---------- 拖拽导入 ---------- */
/* ---------- Alt + 鼠标切段 ---------- */
window.addEventListener('mousedown', e=>{
  if(!e.altKey || !clips.length) return;
  if(e.button === 0){ e.preventDefault(); prev(); }
  else if(e.button === 2){ e.preventDefault(); next(); }
});
window.addEventListener('contextmenu', e=>{ if(e.altKey) e.preventDefault(); });

window.addEventListener('dragover', e=>{ e.preventDefault(); });
window.addEventListener('drop', e=>{
  e.preventDefault();
  const items = e.dataTransfer && e.dataTransfer.items;
  if(items && items.length){
    const entries = [];
    for(const it of items){
      if(it.kind !== 'file') continue;
      const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
      if(entry) entries.push(entry);
    }
    if(entries.length){
      readEntries(entries, files=>addFiles(files));
      return;
    }
  }
  addFiles(e.dataTransfer.files);
});
function readEntries(entries, done){
  const out = [];
  let pending = entries.length;
  if(!pending){ done(out); return; }
  entries.forEach(entry=>walk(entry, ()=>{ if(--pending === 0) done(out); }));
  function walk(entry, cb){
    if(entry.isFile){
      entry.file(f=>{ out.push(f); cb(); }, cb);
    } else if(entry.isDirectory){
      const reader = entry.createReader();
      const readBatch = ()=>{
        reader.readEntries(list=>{
          if(!list.length){ cb(); return; }
          let left = list.length;
          list.forEach(e=>walk(e, ()=>{ if(--left === 0) readBatch(); }));
        }, cb);
      };
      readBatch();
    } else cb();
  }
}

/* ---------- 按钮 ---------- */
/* ---------- 保存 / 导入 ZIP ---------- */
const crcTable = (()=>{ const t=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[i]=c; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=crcTable[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const zte = new TextEncoder();
function z16(v){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,v,true); return b; }
function z32(v){ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,v,true); return b; }
function dosNow(){ const d=new Date(); return {time:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}; }
function zcat(arrs){ let t=0; for(const a of arrs) t+=a.length; const o=new Uint8Array(t); let p=0; for(const a of arrs){ o.set(a,p); p+=a.length; } return o; }
async function buildZip(entries){
  const parts=[], central=[];
  let offset=0;
  const {time,date}=dosNow();
  for(let i=0;i<entries.length;i++){
    const e=entries[i];
    const nb=zte.encode(e.path);
    const crc=crc32(e.data);
    const local=zcat([z32(0x04034b50),z16(20),z16(0x0800),z16(0),z16(time),z16(date),z32(crc),z32(e.data.length),z32(e.data.length),z16(nb.length),z16(0)]);
    parts.push(local,nb,e.data);
    central.push(zcat([z32(0x02014b50),z16(20),z16(20),z16(0x0800),z16(0),z16(time),z16(date),z32(crc),z32(e.data.length),z32(e.data.length),z16(nb.length),z16(0),z16(0),z16(0),z16(0),z32(0),z32(offset)]),nb);
    offset+=local.length+nb.length+e.data.length;
  }
  let cs=0; for(const a of central) cs+=a.length;
  const end=zcat([z32(0x06054b50),z16(0),z16(0),z16(entries.length),z16(entries.length),z32(cs),z32(offset),z16(0)]);
  return new Blob([zcat([...parts,...central,end])],{type:'application/zip'});
}
function guessType(n){
  const e=(n.split('.').pop()||'').toLowerCase();
  if(['mp4','m4v','mov'].includes(e)) return 'video/mp4';
  if(e==='webm') return 'video/webm';
  if(e==='mkv') return 'video/x-matroska';
  if(['jpg','jpeg'].includes(e)) return 'image/jpeg';
  if(e==='png') return 'image/png';
  if(e==='gif') return 'image/gif';
  if(e==='webp') return 'image/webp';
  return 'application/octet-stream';
}
async function exportZip(){
  if(!clips.length) return;
  const cfg={version:1,prefs:{speed:speedSel.value,chain,loop,abOn,vol:volume.value},clips:[]};
  const entries=[];
  for(let i=0;i<clips.length;i++){
    const c=clips[i];
    const path='videos/'+String(i).padStart(3,'0')+'_'+c.name;
    toast('打包中 ' + (i+1) + '/' + clips.length);
    entries.push({path, data:new Uint8Array(await c.file.arrayBuffer())});
    cfg.clips.push({file:c.name,path,type:c.type,label:c.label||null,vol:(c.vol!=null?c.vol:video.volume),speed:(c.speed||1),duration:isFinite(c.duration)?c.duration:null});
  }
  entries.push({path:'config.json', data:zte.encode(JSON.stringify(cfg,null,2))});
  const blob=await buildZip(entries);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href=URL.createObjectURL(blob);
  a.download='排练包-'+stamp+'.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
async function readZipFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-22-65536);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error('不是有效的 ZIP 文件');
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const out=new Map();
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('ZIP 目录解析失败');
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commentLen=dv.getUint16(p+32,true);
    const localOff=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nameLen));
    const lp=localOff;
    if(dv.getUint32(lp,true)!==0x04034b50) throw new Error('ZIP 局部头解析失败');
    const ln=dv.getUint16(lp+26,true), le=dv.getUint16(lp+28,true);
    let data=buf.subarray(lp+30+ln+le, lp+30+ln+le+csize);
    if(method===8){
      data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else if(method!==0){ throw new Error('不支持的压缩方式'); }
    out.set(name,data);
    p+=46+nameLen+extraLen+commentLen;
  }
  return out;
}
function clearAll(){
  clearTimeout(imgTimer);
  clips.forEach(c=>{ try{ URL.revokeObjectURL(c.url); }catch(e){} });
  clips=[]; cur=-1;
  video.pause(); video.removeAttribute('src'); video.style.display='block';
  image.style.display='none'; image.removeAttribute('src');
  progress.disabled=false;
  renderStrip(); updateInfo(); syncPlayIcon(); syncEditBar();
  $('#empty').style.display='flex';
}
async function importZip(file){
  const map=await readZipFile(file);
  const cfgRaw=map.get('config.json');
  if(!cfgRaw) throw new Error('zip 里没有 config.json');
  const cfg=JSON.parse(new TextDecoder().decode(cfgRaw));
  const files=[];
  for(const c of cfg.clips||[]){
    const data=map.get(c.path);
    if(!data) continue;
    files.push(new File([data], c.file, {type:guessType(c.file)}));
  }
  if(!files.length) throw new Error('zip 里没有视频/图片文件');
  clearAll();
  addFiles(files);
  const byName=new Map(); clips.forEach(cl=>byName.set(cl.name,cl));
  (cfg.clips||[]).forEach(c=>{
    const cl=byName.get(c.file);
    if(!cl) return;
    if(c.label) cl.label=c.label;
    if(c.vol!=null) cl.vol=c.vol;
    if(c.speed) cl.speed=c.speed;
  });
  if(cfg.prefs){
    if(['0.5','0.75','1','1.25','1.5','1.75','2'].includes(String(cfg.prefs.speed))) speedSel.value=String(cfg.prefs.speed);
    if(cfg.prefs.vol!=null) volume.value=cfg.prefs.vol;
    chain=!!cfg.prefs.chain; loop=!!cfg.prefs.loop; abOn=!!cfg.prefs.abOn;
    video.volume=volume.value/100;
    video.playbackRate=parseFloat(speedSel.value);
    savePrefs();
  }
  renderStrip(); updateInfo(); syncEditBar(); syncToggles();
}

editSpeed.addEventListener('change', ()=>{ const c = clips[cur]; if(!c) return; c.speed = parseFloat(editSpeed.value); video.playbackRate = c.speed; speedSel.value = editSpeed.value; savePrefs(); });
btnLoop.onclick = ()=>{ loop = !loop; syncToggles(); };
btnChain.onclick = ()=>{ chain = !chain; syncToggles(); };
  btnAB.onclick = ()=>{ abOn = !abOn; syncToggles(); };
$('#btnSetA').onclick = setA;
$('#btnSetB').onclick = setB;
$('#btnClearAB').onclick = clearAB;
$('#btnHelp').onclick = ()=>$('#help').classList.add('show');
$('#btnHelpClose').onclick = ()=>$('#help').classList.remove('show');
$('#help').addEventListener('click', e=>{ if(e.target === $('#help')) $('#help').classList.remove('show'); });

syncVol(); syncPlayIcon(); syncToggles();
window.addEventListener('beforeunload', ()=>{
  clips.forEach(c=>{ try{ URL.revokeObjectURL(c.url); }catch(e){} });
});
